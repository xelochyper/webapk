<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Maino Games</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goToProfil()">
        <ion-icon name="person-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Banner -->
  <div style="background: linear-gradient(135deg, #0071e3, #bf5af2); padding: 30px 20px; text-align: center; color: #fff;">
    <h1 style="margin: 0; font-size: 1.5rem;">Selamat Datang di Maino Games</h1>
    <p style="margin: 8px 0 0; opacity: 0.9;">Toko Digital Terlengkap & Terpercaya</p>
  </div>

  <!-- Statistik 3 Warna -->
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; margin-top: -25px;">
    <div class="stat-card" style="background: linear-gradient(135deg, #0071e3, #40a9ff);" (click)="goToKatalog()">
      <div class="stat-number">{{ statProducts }}</div>
      <div class="stat-label">📦 Katalog</div>
    </div>
    <div class="stat-card" style="background: linear-gradient(135deg, #34c759, #30d158);">
      <div class="stat-number">{{ statSuccess }}</div>
      <div class="stat-label">✅ Terjual</div>
    </div>
    <div class="stat-card" style="background: linear-gradient(135deg, #bf5af2, #d88bff);">
      <div class="stat-number">{{ statUsers }}</div>
      <div class="stat-label">👥 Terdaftar</div>
    </div>
  </div>

  <!-- Produk Terbaru -->
  <div style="padding: 0 15px 10px; display: flex; justify-content: space-between; align-items: center;">
    <h3 style="margin: 0;">Produk Terbaru</h3>
    <ion-button fill="clear" size="small" (click)="goToKatalog()">Lihat Semua →</ion-button>
  </div>

  <div *ngIf="loading" style="text-align: center; padding: 40px;">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="product-grid" *ngIf="!loading">
    <div class="product-card" *ngFor="let p of products" (click)="goToDetail(p.slug)">
      <img [src]="p.cover" [alt]="p.title" onerror="this.src='assets/icon/default.png'">
      <div class="product-info">
        <div class="product-name">{{ p.title }}</div>
        <div class="product-price" [class.free]="p.price == 0">
          {{ p.price_text }}
        </div>
      </div>
    </div>
  </div>

  <div style="height: 20px;"></div>
</ion-content>

<!-- Bottom Navigation -->
<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button (click)="router.navigate(['/home'])" selected>
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Beranda</ion-label>
    </ion-tab-button>
    <ion-tab-button (click)="router.navigate(['/katalog'])">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Katalog</ion-label>
    </ion-tab-button>
    <ion-tab-button (click)="router.navigate(['/pembelian'])">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
      <ion-label>Pembelian</ion-label>
    </ion-tab-button>
    <ion-tab-button (click)="goToProfil()">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Profil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
