<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Daftar Akun</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="text-align: center; padding: 20px 0;">
    <div style="font-size: 3rem;">📝</div>
    <h2>Buat Akun Baru</h2>
    <p style="color: var(--ion-color-medium);">Daftar untuk mulai berbelanja</p>
  </div>

  <ion-card>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Nama Lengkap *</ion-label>
        <ion-input [(ngModel)]="full_name" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Email *</ion-label>
        <ion-input type="email" [(ngModel)]="email" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Nomor WhatsApp</ion-label>
        <ion-input type="tel" [(ngModel)]="whatsapp"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Password *</ion-label>
        <ion-input type="password" [(ngModel)]="password" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Konfirmasi Password *</ion-label>
        <ion-input type="password" [(ngModel)]="confirm_password" required></ion-input>
      </ion-item>

      <ion-button expand="block" color="primary" (click)="register()" style="margin-top: 20px;">
        <ion-icon name="person-add-outline" slot="start"></ion-icon>
        Daftar Sekarang
      </ion-button>

      <div style="text-align: center; margin-top: 15px;">
        <p>Sudah punya akun?
          <a (click)="goToLogin()" style="color: var(--ion-color-primary); cursor: pointer; font-weight: 500;">Login di sini</a>
        </p>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
